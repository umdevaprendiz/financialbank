spring.config.import=optional:dotenv:.env
spring.datasource.url=jdbc:mysql://${CHAVE_SQL_HOST}/${CHAVE_SQL_DB}
spring.datasource.username=${CHAVE_SQL_USER}
spring.datasource.password=${CHAVE_SQL_PASSWORD}

# Podemos mapear do próprio env

app.admin.email=${ADMIN_EMAIL}
app.admin.cpf=${ADMIN_CPF}
app.admin.password=${ADMIN_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.session.jdbc.initialize-schema=always

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

