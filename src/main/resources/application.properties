spring.config.import=optional:dotenv:.env
spring.datasource.url=jdbc:mysql://${CHAVE_SQL_HOST}/${CHAVE_SQL_DB}
spring.datasource.username=${CHAVE_SQL_USER}
spring.datasource.password=${CHAVE_SQL_PASSWORD}

# Podemos mapear do pr�prio env

app.admin.email=${ADMIN_EMAIL}
app.admin.cpf=${ADMIN_CPF}
app.admin.password=${ADMIN_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.session.jdbc.initialize-schema=always

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Cookie de sessao mais seguro: nao acessivel via JS, e so enviado em navegacao/XHR
# de mesmo contexto de site (Lax). "secure=true" fica pra quando o deploy estiver
# atras de HTTPS (Railway) - ligar localmente quebraria o cookie em http://localhost.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

