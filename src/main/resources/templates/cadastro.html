<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinancialBank - Login</title>
</head>
<body>

<div class="Logo">
    <h1>FinancialBank</h1>
</div>

<div class="cadastro">
    <h1>Login</h1>

    <label class="label-name">Nome</label>
    <label for="nome"></label><input type="text" id="nome" placeholder="Digite seu nome!"> <label class="label-login">Usuário</label>

    <label for="usuario"></label><input type="text" id="usuario" placeholder="Digite seu usuário"> <label class="label-senha">Senha</label>
    <label for="senha"></label><input type="password" id="senha" placeholder="Digite sua senha"> <button class="btn-entrar" onclick="logar()">Entrar</button>
</div>

<script src="script.js"></script>

</body>
</html>
