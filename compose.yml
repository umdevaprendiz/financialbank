# Sobe o banco + a API com um comando só: docker compose up --build
# Credenciais aqui são só de desenvolvimento local, não usadas em produção
# (produção usa as variáveis reais configuradas na Railway).
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: financialbank
      MYSQL_USER: financialbank
      MYSQL_PASSWORD: financialbank
    ports:
      - "3307:3306" # 3306 já está ocupado pelo MySQL de outro projeto (appstudying) nessa máquina
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CHAVE_SQL_HOST: mysql:3306
      CHAVE_SQL_DB: financialbank
      CHAVE_SQL_USER: financialbank
      CHAVE_SQL_PASSWORD: financialbank
      ADMIN_EMAIL: admin@financialbank.com
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"

volumes:
  mysql_data:
